{% extends "base.html" %}
{% block title %}Dashboard – Gestión de Pagos{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-5 fw-bold"><i class="bi bi-trophy-fill text-warning me-2"></i>Gestión de Pagos</h1>
  <p class="lead text-muted">Administrá jugadores, eventos y el estado de cada pago.</p>
  <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="{{ url_for('jugadores.list') }}" class="btn btn-primary btn-lg">
      <i class="bi bi-people-fill me-2"></i>Ver Jugadores
    </a>
    <a href="{{ url_for('eventos.list') }}" class="btn btn-success btn-lg">
      <i class="bi bi-calendar-event-fill me-2"></i>Ver Eventos
    </a>
  </div>
</div>
{% endblock %}
