{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-person-fill me-2"></i>{{ titulo }}</h5>
      </div>
      <div class="card-body">
        <form method="post">

          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre completo <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ usuario.nombre if usuario else '' }}" required />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control"
                   value="{{ usuario.email if usuario else '' }}" required />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
            <select name="idRol" class="form-select" required>
              {% for r in roles %}
              <option value="{{ r.idRol }}"
                {% if usuario and usuario.idRol == r.idRol %}selected{% endif %}>
                {{ r.nombre | capitalize }}
                — {{ r.descripcion }}
              </option>
              {% endfor %}
            </select>
          </div>

          {% if usuario %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Estado</label>
            <select name="activo" class="form-select">
              <option value="1" {% if usuario.activo %}selected{% endif %}>Activo</option>
              <option value="0" {% if not usuario.activo %}selected{% endif %}>Inactivo</option>
            </select>
          </div>
          {% endif %}

          <hr />
          <p class="text-muted small mb-2">
            {% if usuario %}Dejá en blanco para no cambiar la contraseña.
            {% else %}La contraseña debe tener al menos 6 caracteres.{% endif %}
          </p>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">
                Contraseña {% if not usuario %}<span class="text-danger">*</span>{% endif %}
              </label>
              <input type="password" name="password" class="form-control"
                     {% if not usuario %}required{% endif %}
                     minlength="6" placeholder="Mínimo 6 caracteres" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirmar contraseña</label>
              <input type="password" name="confirma_password" class="form-control"
                     placeholder="Repetir contraseña" />
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Guardar
            </button>
            <a href="{{ url_for('usuarios.list') }}" class="btn btn-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
