{% extends "base.html" %}
{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-key me-2"></i>Cambiar Contraseña</h5>
      </div>
      <div class="card-body">
        <p class="text-muted small mb-3">
          Usuario: <strong>{{ session.usuario_nombre }}</strong> &mdash;
          Rol: <strong>{{ session.usuario_rol | capitalize }}</strong>
        </p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nueva contraseña</label>
            <input type="password" name="nueva_password" class="form-control"
                   minlength="6" required placeholder="Mínimo 6 caracteres" />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirmar contraseña</label>
            <input type="password" name="confirma_password" class="form-control"
                   required />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Guardar
            </button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
