{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-person-fill me-2"></i>{{ titulo }}</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Apellido y Nombre <span class="text-danger">*</span></label>
            <input type="text" name="ApellidoNombre" class="form-control"
                   value="{{ jugador.ApellidoNombre if jugador else '' }}" required />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Alias</label>
              <input type="text" name="Alias" class="form-control"
                     value="{{ jugador.Alias if jugador else '' }}" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Teléfono</label>
              <input type="tel" name="telefono" class="form-control"
                     value="{{ jugador.telefono if jugador else '' }}" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Dirección</label>
            <input type="text" name="direccion" class="form-control"
                   value="{{ jugador.direccion if jugador else '' }}" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Fecha de Nacimiento</label>
            <input type="date" name="fecNacimiento" class="form-control"
                   value="{{ jugador.fecNacimiento.strftime('%Y-%m-%d') if jugador and jugador.fecNacimiento else '' }}" />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Guardar
            </button>
            <a href="{{ url_for('jugadores.list') }}" class="btn btn-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
